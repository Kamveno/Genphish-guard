[project]
name = "genphish-guard"
version = "0.2.0"
description = "Generator-agnostic phishing detection with label-free calibration under generator shift and a confidence-graded zero-trust response"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Praviveek" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Production prior-shift estimation can use the QuaPy quantification library
# (implements Saerens-Latinne-Decaestecker SLD and BBSE). The in-repo EM is a
# transparent, dependency-free equivalent used for the viva.
quant = ["quapy>=0.1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
