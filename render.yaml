services:
  - type: web
    name: genphish-guard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt -r requirements-api.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
